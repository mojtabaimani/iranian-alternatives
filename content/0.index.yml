title: Iranian Alternatives to Global Digital Services
description: A directory of Iranian alternatives to international tools like Cloudflare, AWS, and Google Analytics. Support local businesses and stay compliant with Iranian regulations.
navigation: false
hero:
  title: Iranian Alternatives to Global Digital Services
  description: A directory of Iranian services that replace international tools like Cloudflare, AWS, and Google Analytics, from cloud infrastructure to SaaS products. Support local businesses while ensuring compliance with Iranian regulations.
  links:
    - label: Browse Categories
      to: '/#categories'
      size: xl
      icon: i-lucide-arrow-right
      trailing: true
    - label: Contribute
      icon: i-simple-icons-github
      size: xl
      color: gray
      to: https://github.com/mojtabaimani/iranian-alternatives
      target: _blank
logos:
  title: Featuring services like
  services:
    - Arvan Cloud
    - Aparat
    - Eitaa
    - Bale
    - Neshan
    - Zarebin
    - Liara
    - Digikala
    - Porsline
    - Hamravesh
    - nsin
    - Paziresh24
sections:
  - title: Why Choose Iranian Alternatives?
    features:
      - name: Reliable Availability
        description: No blocked signups, suspended accounts, or rejected payments. These services are built to work in Iran, with no workarounds needed.
        icon: i-lucide-shield-check
      - name: Payments in Rial
        description: Pay through local gateways and get billed in Iranian Rial (IRR). No foreign credit card required.
        icon: i-lucide-wallet
      - name: Persian Support
        description: Customer support in Persian, in your timezone, from teams that understand the local market.
        icon: i-lucide-headphones
      - name: Data Residency
        description: Your data stays on Iranian infrastructure, which means lower latency and compliance with local data protection regulations.
        icon: i-lucide-database
      - name: Built for the Local Ecosystem
        description: Persian interfaces with proper RTL support, the Jalali calendar, and integrations with Iranian banks and payment gateways.
        icon: i-lucide-puzzle
      - name: Support the Local Economy
        description: Choosing Iranian services supports local businesses, creates jobs, and strengthens the domestic digital economy.
        icon: i-lucide-building
features:
  title: Browse by Category
  description: Find the Iranian alternative to the tool you already use. Every category lists local services with a description, logo, and link.
  links:
    - label: View all categories
      to: /categories
      color: gray
      icon: i-lucide-arrow-right
      trailing: true
cta:
  # {count} is replaced at build time with the number of empty categories
  # (see app/pages/index.vue)
  title: '{count} categories are still empty'
  description: Know an Iranian service that belongs here? Add it and help build the most complete directory of Iranian digital services.
  links:
    - label: Add a service
      to: https://github.com/mojtabaimani/iranian-alternatives/issues/new
      target: _blank
      icon: i-lucide-plus
    - label: "See what's missing"
      to: /categories
      icon: i-lucide-arrow-right
      color: gray
      trailing: true
