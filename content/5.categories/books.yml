- name: Taaghche
  description: Taaghche is Iran's most popular e-book and audiobook app, the local equivalent of Kindle, with a large Persian catalog, subscription reading, and cross-device sync.
  logo: /logo/taaghche.png
  website: https://taaghche.com
  location: Iran
  flag: /flag/iran.svg
  tags:
