title: Classifieds
description: Classifieds platforms let people list second-hand goods, vehicles, property, jobs, and services for direct buyer-to-seller contact. They are the local equivalents of Craigslist and Facebook Marketplace.
icon: i-lucide-tags
tagline: Buy and sell listings, alternatives to Craigslist.
services:
- name: Divar
  description: Divar is Iran's dominant classifieds app for second-hand goods, cars, real estate, jobs, and services, with in-app chat and city-based listings.
  logo: /logo/divar.png
  website: https://divar.ir
  location: Iran
  flag: /flag/iran.svg
  tags:
