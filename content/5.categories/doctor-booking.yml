  description: Boghrat is an Iranian healthcare platform offering online doctor appointment booking and phone, video, and text consultations, plus clinic management software with electronic health records for physicians.
  logo: /logo/boghrat.png
  website: https://boghrat.com
  location: Iran
  flag: /flag/iran.svg
