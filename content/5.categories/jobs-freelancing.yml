- name: JobVision
  description: JobVision is a major Iranian job board and career platform offering job listings, resume building, salary reports, and employer branding tools.
  logo: /logo/jobvision.png
  website: https://jobvision.ir
  location: Iran
  flag: /flag/iran.svg
  tags:
