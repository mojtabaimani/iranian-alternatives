- name: Basalam
  description: Basalam is a social marketplace for handmade, artisanal, and local goods from small Iranian vendors, the local equivalent of Etsy, with direct chat between buyers and sellers.
  logo: /logo/basalam.png
  website: https://basalam.ir
  location: Iran
  flag: /flag/iran.svg
